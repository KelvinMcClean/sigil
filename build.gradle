buildscript {
    repositories {
        mavenCentral()
        google()
    }
}
plugins {
    id 'groovy'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-test-fixtures'
    id 'idea'
}

group = 'io.github.kelvinmcclean'
version = '0.0.1-SNAPSHOT'
description = 'sigil'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    google()
}

idea {
    module {
        testSources.from(file("$projectDir/src/integrationTest/groovy"))
    }
}

// Container-backed integration tests live in their own source set so that they never
// run as part of `gradle test` / `gradle build`.
sourceSets {

    // Shared unit-test logging config (logback-test.xml) applied across all modules.
    test {
        resources.srcDirs += "$rootDir/shared-resources/test-logging"
    }
    integrationTest {
        java.srcDir "$projectDir/src/integrationTest/java"
        resources.srcDirs += "$projectDir/src/integrationTest/resources"

        if (!main.resources.srcDirs.contains(file("$rootDir/shared-resources"))) {
            resources.srcDirs += "$rootDir/shared-resources"
        }
        compileClasspath += test.output + main.output
        runtimeClasspath += test.output + main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}


dependencies {
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'io.github.oshai:kotlin-logging-jvm:7.0.3'
    implementation 'ws.schild:jave-all-deps:3.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation("org.springframework.boot:spring-boot-starter-batch-jdbc")

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.apache.groovy:groovy-nio'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testImplementation 'net.bytebuddy:byte-buddy'
    testImplementation 'org.objenesis:objenesis:3.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.codehaus.groovy:groovy-json:3.0.9'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

clean.doLast {
    try {
        fileTree("$projectDir/logs").forEach { it.delete() }
    } catch (Exception e) {
        logger.warn("Failed to delete log files: ${e.message}")
    }

}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    dependsOn 'bootJar'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    def includesTag = System.properties.includesTag

    useJUnitPlatform {
        if (includesTag != null)
            includeTags includesTag
    }

    if (System.getenv("CI") == null) {
        // Only set the system property if not running in CI, as Github Actions runs an older version.
        // Using this version to support Rancher.
        systemProperty 'api.version', System.getProperty('api.version', '1.41')
    }

    outputs.cacheIf { false }
    group = 'verification'
}