buildscript {
    repositories {
        mavenCentral()
        google()
    }
}
plugins {
    id 'groovy'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-test-fixtures'
    id 'idea'
    id 'jvm-test-suite'

}

apply plugin: 'java'

group = 'io.github.kelvinmcclean'
version = '0.0.1-SNAPSHOT'
description = 'sigil'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    google()
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useSpock('2.4-groovy-5.0')

            sources {
                groovy.srcDirs = ["$projectDir/src/integrationTest/groovy"]
                resources.srcDirs = ["$projectDir/src/integrationTest/resources"]
            }

            dependencies {
                implementation project()
            }

            targets {
                all {
                    testTask.configure {
                        shouldRunAfter test
                    }
                }
            }
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}


dependencies {
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'io.github.oshai:kotlin-logging-jvm:7.0.3'
    implementation 'ws.schild:jave-all-deps:3.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation("org.springframework.boot:spring-boot-starter-batch-jdbc")

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.apache.groovy:groovy-nio'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testImplementation 'net.bytebuddy:byte-buddy'
    testImplementation 'org.objenesis:objenesis:3.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.codehaus.groovy:groovy-json:3.0.9'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

clean.doLast {
    try {
        fileTree("$projectDir/logs").forEach { it.delete() }
    } catch (Exception e) {
        logger.warn("Failed to delete log files: ${e.message}")
    }

}

tasks.named('test') {
    useJUnitPlatform()
}
