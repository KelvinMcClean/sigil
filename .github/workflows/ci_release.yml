name: Release

on:
  push:
    tags: ['*']

jobs:
  build:
    name: Build launchers 🏗
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-without-v: ${{ steps.version.outputs.version-without-v }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: ./gradlew build

      # The release version is the tag that triggered the run.
      - id: version
        name: Resolve version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Bundle both launchers under a single artifact name. artifacts-to-
      # artifactory zips everything in the artifact into <name>-<version>.zip.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sigil
          path: |
            build/libs/sigil-*.*.*-SNAPSHOT.jar
          if-no-files-found: error

  github-release:
    name: GitHub Release 🚀
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + manage the tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sigil
        uses: actions/download-artifact@v4
        with:
          name: sigil
          path: dist
      - name: Rename sigil
        run: |
          mv dist/sigil-*.jar dist/sigil-${{ needs.build.outputs.version-without-v }}.jar

      # gh release create works for annotated, lightweight and signed tags
      # alike, and the tag already exists (it triggered this run).
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            dist/sigil-${{ needs.build.outputs.version-without-v }}.jar
