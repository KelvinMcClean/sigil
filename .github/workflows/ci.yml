name: ci.yml
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        run: ./gradlew build
      - name: Upload
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          path: build/libs/*.jar
          name: sigil
